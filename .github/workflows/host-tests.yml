name: SDK-independent host tests
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host unit and artifact negative tests (no QNX)
        run: python3 -m unittest discover -s tests -v
      - name: Exclude SDK and binary artifacts
        run: sh scripts/check-no-sdk.sh
      - name: Honest job summary
        run: echo 'Host deterministic tests only. No QNX, QEMU, hardware, or live vcan evidence.' >> "$GITHUB_STEP_SUMMARY"
